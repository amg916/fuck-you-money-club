ct on roughly $5M of monthly volume.</title><tspan x="36" dy="0">Assumptions: Composite stress test stacking separately reported figures from different traders; the $80K and $35K results are</tspan><tspan x="36" dy="13.75">arithmetic on those figures, and the $10K is the fee load at about $0.02 per contract on roughly $5M of monthly volume.</tspan></text><text x="36" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Totals reset the cumulative balance; missing values do not change it.</title><tspan x="36" dy="0">Totals reset the cumulative balance; missing values do not change it.</tspan></text></svg>