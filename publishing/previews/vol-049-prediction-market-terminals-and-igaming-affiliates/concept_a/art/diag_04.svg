<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>The Live-Trading Latency Ladder</title><desc>diagram id: diag-04-live-trading-latency-ladder; chapter number: 2; title: The Live-Trading Latency Ladder; subtitle: Seconds separating consumer signals from the traders already moving the price; chart type: horizontal_bars; unit: seconds; bars: label: OddsJam odds refresh; min: 5; max: 5; typical: 5; display: 5 seconds; label: ESPN Gamecast lead over TV; min: 5; max: 15; typical: 10; display: 5 to 15 seconds; label: Consumer stream delay; min: 7; max: 30; typical: 10; display: 7, 10 or up to 30 seconds; label: Free feed lag; min: 15; max: 30; typical: 22.5; display: 15 to 30 seconds; label: Dashboard cache window; min: 30; max: 30; typical: 30; display: 30 seconds; caption: Latency is the hard ceiling on live cross-venue trading: an ESPN-fed Kalshi bot lost money as Kalshi moved before the free signal, while pro feeds run near $5,000 a month.; assumptions note: Typical values are the midpoint of the stated range where no point estimate was given (Gamecast, free feed); the consumer stream typical uses the 10-second figure named by the speaker. Refresh and cache bars come from odds-API practitioners for comparison.; note: Attributed to Part Time Larry (bA_NUrMJuw4), Whale Slots (QpjzafRRmjQ), OddsJam (ZTKIge6SyQI) and SportsGameOdds API (JXdlRbDVFNY).</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>The Live-Trading Latency Ladder</title><tspan x="36" dy="0">The Live-Trading Latency Ladder</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-