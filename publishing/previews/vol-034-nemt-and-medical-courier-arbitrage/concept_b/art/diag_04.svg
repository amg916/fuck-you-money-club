<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Weekly Revenue Bands for Direct and Contract Courier Work</title><desc>diagram id: diag-04-weekly-revenue-bands; chapter number: 2; title: Weekly Revenue Bands for Direct and Contract Courier Work; subtitle: Direct retainers and routes against the vehicle-class ladder; chart type: horizontal_bars; unit: USD per week; bars: label: Direct oxygen supply route; min: 655; max: 655; typical: 655; display: About $131/day x 5 days ($2,620/month); label: Direct client weekly retainer; min: 750; max: 1000; typical: 875; display: $750-$1,000 per week; label: Sedan contract work; min: 800; max: 1500; typical: 1150; display: $800-$1,500 per week; label: Cargo van contract work; min: 1500; max: 3500; typical: 2500; display: $1,500-$3,500 per week ($2,500 van route posted); label: Non-CDL box truck work; min: 4000; max: 8000; typical: 6000; display: $4,000-$8,000 per week; caption: Direct contracts set the floor; vehicle capacity widens the ceiling of what can be bid.; assumptions note: Typical values are midpoints of each quoted range; the oxygen route weekly figure multiplies the quoted $131 per day by the 5 service days stated.; note: Sources - Giganomic Era (YV5-h4wgh4Q @ 00:05:08); Giganomic Era retainer playbook; JT Automations (gpeFpvbyWg4 @ 00:04:02, 00:29:09).</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Weekly Revenue Bands for Direct and Contract Courier Work</title><tspan x="59" dy="0">Weekly Revenue Bands for Direct and Contract Courier</tspan><tspan x="59" dy="36.25"