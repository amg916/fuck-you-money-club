<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>From Mineral Value to the Bonus Actually Offered</title><desc>diagram id: diag-03-lease-bonus-waterfall; chapter number: 3; title: From Mineral Value to the Bonus Actually Offered; subtitle: Matt Sands&#x27; divide-by-2-or-3 rule against a Nacogdoches Haynesville offer; chart type: waterfall; bars: label: Mineral value per NMA; value: 3000; display: $3,000/NMA; kind: total; label: Divide by 2 for the top of range; value: -1500; display: -$1,500; kind: deduction; label: Fair bonus at divide-by-2; value: 1500; display: $1,500/acre; kind: total; label: Step down to divide-by-3; value: -500; display: -$500; kind: deduction; label: Gap to the landman offer; value: -700; display: -$700; kind: deduction; label: Offer on 14.3 NMA; value: 300; display: $300/NMA; kind: result; caption: Sands prices a fair bonus at mineral value divided by 2 or 3, so $3,000/NMA minerals support about $1,000/acre, far above the $300/NMA offer on the table.; assumptions note: The $3,000, $1,000 and $300 figures are Sands&#x27; own. The $1,500 step and the deductions are simple arithmetic on those figures. Sands still favors the highest royalty rate over bonus.; note: Attributed to Matt Sands (xiP5PiaaYKE, qru8bh4mMms) on YouTube, answering a Nacogdoches County Haynesville lease offer.</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>From Mineral Value to the Bonus Actually Offered</title><tspan x="59" dy="0">From Mineral Value to the Bonus Actually Offered</tspan></text><text x="36" y="139" font-fam