><tspan x="36" dy="0">Assumptions: The $3,000, $1,000 and $300 figures are Sands&#x27; own. The $1,500 step and the deductions are simple arithmetic on those</tspan><tspan x="36" dy="13.75">figures. Sands still favors the highest royalty rate over bonus.</tspan></text><text x="36" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Totals reset the cumulative balance; missing values do not change it.</title><tspan x="36" dy="0">Totals reset the cumulative balance; missing values do not change it.</tspan></text></svg>