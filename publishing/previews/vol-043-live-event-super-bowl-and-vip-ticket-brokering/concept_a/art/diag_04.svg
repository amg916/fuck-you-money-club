<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Super Bowl Seat Price Bands by Sourcing Path</title><desc>diagram id: diag-04-super-bowl-sourcing-price-bands; chapter number: 2; chart type: horizontal_bars; title: Super Bowl Seat Price Bands by Sourcing Path; subtitle: Face value, broker cash offers, resale floors and listing ceilings; unit: USD per ticket; caption: Reported price bands from face value through the highest listings, as described by brokers, TickPick coverage and allocation walkthroughs.; assumptions note: Face value is reachable only through season-holder raffles, roster allotments, sponsors or contests; listing ceilings are asks, not completed sales.; note: Sources: 24H SPORT (pAU7eEVgp1A @ 00:00:40, 00:01:17, 00:03:42), thumbsuprun (O-Sq4DDGKAY @ 00:04:02 and 00:06:24).; bars: label: Face value seats; min: 950; max: 1250; typical: 950; display: $950 face; players often hold $1,250 seats; label: Pre-game party cash offer; min: 2500; max: 2500; typical: 2500; display: $2,500 cash from brokers; label: Buyer floor near game day; min: 3200; max: 3200; typical: 3200; display: Buyers grab seats around $3,200; label: Reported resale floors; min: 3500; max: 4500; typical: 4000; display: $3,500 to $4,500; about $4,000 on StubHub and TickPick; label: Listing ceilings; min: 16000; max: 30000; typical: 16000; display: Up to $16,000 on Ticketmaster; up to $30,000 elsewhere</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Super Bowl Seat Price Bands by Sourcing Path</title><tspan x="36" dy="0">Super Bowl Seat Price Bands by Sourcing Path</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#141