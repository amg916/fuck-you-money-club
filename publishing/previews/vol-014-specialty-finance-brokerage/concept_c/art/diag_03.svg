<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>The Same $25,000, Licensed Versus Unlicensed</title><desc>diagram id: diag-03-licensing-exposure-waterfall; chapter number: 3; chart type: waterfall; title: The Same $25,000, Licensed Versus Unlicensed; subtitle: California licensing cost against securities rescission exposure; caption: Meeting California&#x27;s commercial finance license costs a fee of $500 to $1,000 against a $25,000 net-worth floor, while selling another sponsor&#x27;s security without a license can turn a $25,000 fee into a $1 million judgment.; assumptions note: Two separate scenarios sit side by side. Bars one to three use Funder Intel&#x27;s California figures at the high end of the fee range; bars four to six use Trowbridge Law Group&#x27;s rescission example. Result bars are plain arithmetic.; note: Sources are Funder Intel and Trowbridge Law Group.; bars: label: California net-worth floor; value: 25000; display: $25,000; kind: total; label: License fee at the high end; value: -1000; display: -$1,000 (range $500 to $1,000); kind: deduction; label: Net worth after the license fee; value: 24000; display: $24,000; kind: result; label: Fee for selling a $1M raise unlicensed; value: 25000; display: $25,000; kind: total; label: Rescission judgment; value: -1000000; display: -$1,000,000; kind: deduction; label: Net exposure after rescission; value: -975000; display: -$975,000; kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#F8F4EC" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Palatino, Georgia, serif" font-size="28" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>The Same $25,000, Licensed Versus Unlicensed</title><tspan x="36" dy="0">The Same $25,000, Licensed Versus Unlicensed</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#B68D40" stroke-width="2"/><text x="36" y="139" font-family="Helvetica, sans-serif" font-size="1