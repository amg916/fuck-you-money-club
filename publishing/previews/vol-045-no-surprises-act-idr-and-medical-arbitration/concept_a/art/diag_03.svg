tle><tspan x="890.3333333333334" dy="0">Cushion above</tspan><tspan x="890.3333333333334" dy="13.75">trigger after fee</tspan></text><line x1="36" y1="535" x2="964" y2="535" stroke="#D8CEBE" stroke-width="1"/><text x="36" y="556" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Assumptions: Intermediate results are simple subtraction of the reported $850, $300, $400, and $25 figures; collections and late-fee accrual are suspended while the case is pending.</title><tspan x="36" dy="0">Assumptions: Intermediate results are simple subtraction of the reported $850, $300, $400, and $25 figures; collections and late-fee</tspan><tspan x="36" dy="13.75">accrual are suspended while the case is pending.</tspan></text><text x="36" y="592" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Totals reset the cumulative balance; missing values do not change it.</title><tspan x="36" dy="0">Totals reset the cumulative balance; missing values do not change it.</tspan></text></svg>