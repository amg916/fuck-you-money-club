<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Patient-Provider Dispute Eligibility on an $850 Bill</title><desc>diagram id: diag-03-ppdr-eligibility-waterfall; chapter number: 3; title: Patient-Provider Dispute Eligibility on an $850 Bill; subtitle: How a $300 good faith estimate clears the $400 per-provider trigger; chart type: waterfall; bars: label: Billed charges; value: 850; display: $850; kind: total; label: Good faith estimate; value: 300; display: -$300; kind: deduction; label: Excess over estimate; value: 550; display: $550; kind: result; label: PPDR trigger threshold; value: 400; display: -$400; kind: deduction; label: Patient administrative fee; value: 25; display: -$25; kind: deduction; label: Cushion above trigger after fee; value: 125; display: $125; kind: result; caption: A $300 estimate against an $850 bill exceeds the $400 per-provider threshold, qualifying for PPDR within 120 days for a $25 fee.; assumptions note: Intermediate results are simple subtraction of the reported $850, $300, $400, and $25 figures; collections and late-fee accrual are suspended while the case is pending.; note: Attributed to CMSHHSgov (RRI2VT8QiiI) for the threshold, example, and fee, and DAS Health (e5b1ICVPSZs) for the collections freeze.</desc><rect x="0" y="0" width="1000" height="620" fill="#F8F4EC" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Palatino, Georgia, serif" font-size="28" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Patient-Provider Dispute Eligibility on an $850 Bill</title><tspan x="36" dy="0">Patient-Provider Dispute Eligibility on an $850 Bill</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#B68D40" stroke-width="2"/><text x="36" y="139" font-family="Helvetica, sans-serif" font-size="12" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</t