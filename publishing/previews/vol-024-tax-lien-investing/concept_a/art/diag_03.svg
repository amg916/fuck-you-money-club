<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Cook County Redemption Waterfall</title><desc>diagram id: diag-03-cook-county-redemption-waterfall; chapter number: 3; title: Cook County Redemption Waterfall; subtitle: Overall redemption versus Chicago&#x27;s south and west sides; chart type: waterfall; bars: label: All Cook County Liens Sold; value: 100; display: 100%; kind: total; label: Redeemed Overall; value: 96; display: -96%; kind: deduction; label: Left Unredeemed Overall; value: 4; display: 4%; kind: result; label: South and West Side Liens; value: 100; display: 100%; kind: total; label: Redeemed on South and West Sides; value: 70; display: About -70%; kind: deduction; label: Left Unredeemed in Rougher Areas; value: 30; display: About 30%; kind: result; caption: Countywide, almost every Cook County lien pays off; in rougher Chicago neighborhoods the odds of ending up owning the parcel rise sharply.; assumptions note: Unredeemed shares are the arithmetic complement of Bob Diamond&#x27;s 96% and about-70% redemption figures; Illinois rules, including the 22-5 notice deadline of four months and 15 days, decide whether a lien holds.; note: Source: Bob Diamond - America&#x27;s Tax Sale Attorney (B0WBR5swuac @ 00:03:17; bFO7QIn_w3U @ 00:03:36).</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Cook County Redemption Waterfall</title><tspan x="36" dy="0">Cook County Redemption Waterfall</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><