ed $225 after-hours rate and $75 travel line; step-downs are the differences between reported rates. Parts and shipping lines are excluded because no figures were given.</title><tspan x="36" dy="0">Assumptions: The opening bar adds the reported $225 after-hours rate and $75 travel line; step-downs are the differences between</tspan><tspan x="36" dy="13.75">reported rates. Parts and shipping lines are excluded because no figures were given.</tspan></text><text x="36" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Totals reset the cumulative balance; missing values do not change it.</title><tspan x="36" dy="0">Totals reset the cumulative balance; missing values do not change it.</tspan></text></svg>