<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Dental Service Rate Ladder</title><desc>diagram id: diag-03-dental-service-rate-ladder; chapter number: 3; chart type: waterfall; title: Dental Service Rate Ladder; subtitle: Bright Idea Dental Repair rate card, from after-hours call to launch rate; caption: Jason of Bright Idea Dental Repair launched at $150 an hour, now bills $175 regular and $225 after hours, plus $75 travel beyond 30 minutes, invoiced on labor, parts, travel and shipping lines.; assumptions note: The opening bar adds the reported $225 after-hours rate and $75 travel line; step-downs are the differences between reported rates. Parts and shipping lines are excluded because no figures were given.; note: Attributed to Jason of Bright Idea Dental Repair on the Better Biomed Channel.; bars: label: After-hours hour plus travel; value: 300; display: $225 + $75 travel; kind: total; label: Travel fee beyond 30 minutes; value: 75; display: -$75; kind: deduction; label: After-hours premium; value: 50; display: -$50; kind: deduction; label: Regular hourly labor rate; value: 175; display: $175/hr; kind: result; label: Gap back to launch pricing; value: 25; display: -$25; kind: deduction; label: Launch hourly labor rate; value: 150; display: $150/hr; kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Dental Service Rate Ladder</title><tspan x="59" dy="0">Dental Service Rate Ladder</tspan></text><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#09090B" text-anchor="start" style=