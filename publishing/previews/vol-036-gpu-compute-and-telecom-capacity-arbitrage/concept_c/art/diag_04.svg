<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Memory Prices the Asset</title><desc>diagram id: diag-04-gpu-memory-capacity-bars; chapter number: 2; title: Memory Prices the Asset; subtitle: Reported GPU memory capacities and model footprints; chart type: horizontal_bars; unit: GB; bars: label: H100 HBM3 capacity; min: 80; max: 80; typical: 80; display: 80 GB at 3.35 TB/s; label: Hardware-unlocked CMP 170HX; min: 64; max: 80; typical: 80; display: 80 GB, one card stuck at 64 GB; label: Llama 3.3 70B at Q4; min: 43; max: 43; typical: 43; display: ~43 GB; label: Generational on-chip memory jump; min: 39; max: 39; typical: 39; display: +39 GB; label: 27B model, 4-bit to BF16; min: 14; max: 54; typical: 27; display: 14 GB to 54 GB (FP8 at 27 GB); caption: Decode is memory-bound, so capacity and bandwidth, not headline teraflops, decide what a card is worth.; assumptions note: Single-value bars use the reported figure for min, max and typical; the 27B ladder is reported on an H100 and sits in the inference-engine testimony.; note: Sources: Hitesh C. (fKrvPg4P6KY), LOCKBREAK (k-M24u2WcZw), Gimel12 (gD-lTOjHc04), Design Guy (PnUJffgghas), AI WITH Rithesh (lasG5MsR-gE).</desc><rect x="0" y="0" width="1000" height="620" fill="#F8F4EC" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Palatino, Georgia, serif" font-size="28" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Memory Prices the Asset</title><tspan x="36" dy="0">Memory Prices the Asset</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#B68D40" stroke-width="2"/><text x="36" y="139" font-family="Helvetica, sans-serif" font-size="12" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><line x1="232.0" y1="166" x2="232.0" y2="480" stroke="#CFC6B4" stroke-width="1"/><text x="42" y="208.6" font-family="Opt