<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Velocity Banking Cycle on a $4,000 Card</title><desc>diagram id: diag-03-velocity-banking-cycle; chapter number: 3; title: Velocity Banking Cycle on a $4,000 Card; subtitle: Maria&#x27;s paycheck push and the cash-flow surplus that makes it work; chart type: waterfall; bars: label: Card balance before payday; value: 4000; display: $4,000; kind: total; label: Paycheck pushed on day one; value: 3500; display: -$3,500; kind: deduction; label: Residual balance after push; value: 500; display: $500; kind: result; label: Paycheck income for the month; value: 3500; display: $3,500; kind: total; label: Living expenses charged back on; value: 3200; display: -$3,200; kind: deduction; label: Monthly cash-flow surplus; value: 300; display: $300; kind: result; caption: Pushing the paycheck onto the card crushes the average daily balance; the $500 residual at 19% APR costs about $7.87 over 30 days (Stephen Smith).; assumptions note: The $300 surplus is the arithmetic gap between the $3,500 paycheck and $3,200 of expenses in the example; velocity pushes only work with positive cash flow, even $100 a month.; note: Source - Stephen Smith; float discipline echoed by Joey of Amazon FBA and Mogulnomics.</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Velocity Banking Cycle on a $4,000 Card</title><tspan x="59" dy="0">Velocity Banking Cycle on a $4,000 Card</tspan></text><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#09090B" text-anchor="start" style="font-vari