<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Velocity Banking Cycle on a $4,000 Card</title><desc>diagram id: diag-03-velocity-banking-cycle; chapter number: 3; title: Velocity Banking Cycle on a $4,000 Card; subtitle: Maria&#x27;s paycheck push and the cash-flow surplus that makes it work; chart type: waterfall; bars: label: Card balance before payday; value: 4000; display: $4,000; kind: total; label: Paycheck pushed on day one; value: 3500; display: -$3,500; kind: deduction; label: Residual balance after push; value: 500; display: $500; kind: result; label: Paycheck income for the month; value: 3500; display: $3,500; kind: total; label: Living expenses charged back on; value: 3200; display: -$3,200; kind: deduction; label: Monthly cash-flow surplus; value: 300; display: $300; kind: result; caption: Pushing the paycheck onto the card crushes the average daily balance; the $500 residual at 19% APR costs about $7.87 over 30 days (Stephen Smith).; assumptions note: The $300 surplus is the arithmetic gap between the $3,500 paycheck and $3,200 of expenses in the example; velocity pushes only work with positive cash flow, even $100 a month.; note: Source - Stephen Smith; float discipline echoed by Joey of Amazon FBA and Mogulnomics.</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Velocity Banking Cycle on a $4,000 Card</title><tspan x="36" dy="0">Velocity Banking Cycle on a $4,000 Card</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><li