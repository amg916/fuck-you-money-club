<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>What Protection Costs Before Licensing</title><desc>diagram id: diag-04-protection-cost-stack; chapter number: 2; chart type: horizontal_bars; title: What Protection Costs Before Licensing; subtitle: From a $65 provisional to full attorney-drafted applications; unit: USD; caption: inventRightTV reports 99% of its students over 15 years licensed without a patent, buying perceived ownership with a $65 micro entity provisional and pushing the licensee to fund the non-provisional.; assumptions note: Single quoted fees are plotted with min, max and typical equal. For the nonprovisional and attorney ranges no typical figure was given, so the typical marker sits at the low end of the quoted range.; note: Attributed to USPTOvideo for the fee tiers and attorney range, and inventRightTV for the $65 micro entity rate (income under $150k a year).; bars: label: Provisional fee, micro entity; min: 65; max: 65; typical: 65; display: $65; label: Provisional fee, middle tier; min: 130; max: 130; typical: 130; display: $130; label: Provisional fee, top tier; min: 325; max: 325; typical: 325; display: $325; label: Nonprovisional filing fees; min: 400; max: 2000; typical: 400; display: $400 to $2,000; label: Attorney fees for an application; min: 6000; max: 18000; typical: 6000; display: About $6,000 to $18,000</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>What Protection Costs Before Licensing</title><tspan x="36" dy="0">What Protection Costs Before Licensing</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeri