>pull</tspan></text><line x1="336.6666666666667" y1="280.72727272727275" x2="354.6666666666667" y2="280.72727272727275" stroke="#CFC6B4" stroke-width="1"/><line x1="421.83333333333337" y1="280.72727272727275" x2="421.83333333333337" y2="355.45454545454544" stroke="#11382B" stroke-width="3"/><circle cx="421.83333333333337" cy="355.45454545454544" r="5" fill="#11382B" stroke="none" stroke-width="1"><title>label: No CAD, testing or tooling; value: -3; display: Down to about 5%; kind: deduction</title></circle><text x="421.83333333333337" y="271.72727272727275" font-family="Optima, Calibri, sans-serif" font-size="12" fill="#1D2421" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>-3</title><tspan x="421.83333333333337" dy="0">-3</tspan></text><text x="421.83333333333337" y="499" font-family="Optima, Calibri, sans-serif" font-size="11" fill="#1D2421" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>No CAD, testing or tooling</title><tspan x="421.83333333333337" dy="0">No CAD, testing or</tspan><tspan x="421.83333333333337" dy="13.75">tooling</tspan></text><line x1="489.0" y1="355.45454545454544" x2="507.0" y2="355.45454545454544" stroke="#CFC6B4" stroke-width="1"/><line x1="574.1666666666666" y1="355.45454545454544" x2="574.1666666666666" y2="230.9090909090909" stroke="#11382B" stroke-width="3"/><circle cx="574.1666666666666" cy="230.9090909090909" r="5" fill="#11382B" stroke="none" stroke-width="1"><title>label: Most common average rate; value: 5; display: About 5%; kind: result</title></circle><text x="574.1666666666666" y="221.9090909090909" font-family="Optima, Calibri, sans-serif" font-size="12" fill="#1D2421" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>5</title><tspan x="574.1666666666666" dy="0">5</tspan></text><text x="574.1666666666666" y="499" font-family="Optima, Calibri, sans-serif" font-size="11" fill="#1D2421" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>Most common average rate</title><tspan x="574.1666666666666" dy="0">Most common average</tspan><tspan x="574.1666666666666" dy="13.75">rate</tspan></text><line x1="641.3333333333334" y1="230.9090909090909" x2="659.3333333333334" y2="230.9090909090909" stroke="#CFC6B4" stroke-width="1"/><line x1="726.5" y1="230.9090909090909" x2="726.5" y2="280.72727272727275" stroke="#11382B" stroke-width="3"/><circle cx="726.5" cy="280.72727272727275" r="5" fill="#11382B" stroke="none" stroke-width="1"><title>label: High-volume consumable; value: -2; display: Drops toward 3%; kind: deduction</title></circle><text x="726.5" y="221.9090909090909" font-family="Optima, Calibri, sans-serif" font-size="12" fill="#1D2421" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>-2</title><tspan x="726.5" dy="0">-2</tspan></text><text x="726.5" y="499" font-family="Optima, Calibri, sans-serif" font-size="11" fill="#1D2421" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>High-volume consumable</title><tspan x="726.5" dy="0">High-volume consumable</tspan></text><line x1="793.6666666666667" y1="280.72727272727275" x2="811.6666666666667" y2="280.72727272727275" stroke="#CFC6B4" stroke-width="1"/><line x1="878.8333333333334" y1="280.72727272727275" x2="878.8333333333334" y2="206.0" stroke="#11382B" stroke-width="3"/><circle cx="878.8333333333334" cy="206.0" r="5" fill="#11382B" stroke="none" stroke-width="1"><title>label: Consumable floor; value: 3; display: About 3%; kind: result</title></circle><text x="878.8333333333334" y="197.0" font-family="Optima, Calibri, sans-serif" font-size="12" fill="#1D2421" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>3</title><tspan x="878.8333333333334" dy="0">3</tspan></text><text x="878.8333333333334" y="499" font-family="Optima, Calibri, sans-serif" font-size="11" fill="#1D2421" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>Consumable floor</title><tspan x="878.8333333333334" dy="0">Consumable floor</tspan></text><line x1="36" y1="535" x2="964" y2="535" stroke="#CFC6B4" stroke-width="1"/><text x="36" y="556" font-family="Optima, Calibri, sans-serif" font-size="11" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Assumptions: Over 10% is plotted at 10 and seven-or-eight at 8; step sizes are the differences between the rates Key and Krauss reported. UpCounsel&#x27;s 3 to 6% of gross sales sits inside the same band.</title><tspan x="36" dy="0">Assumptions: Over 10% is plotted at 10 and seven-or-eight at 8; step sizes are the differences between the rates Key and Krauss</tspan><tspan x="36" dy="13.75">reported. UpCounsel&#x27;s 3 to 6% of gross sales sits inside the same band.</tspan></text><text x="36" y="592" font-family="Optima, Calibri, sans-serif" font-size="10" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Totals reset the cumulative balance; missing values do not change it.</title><tspan x="36" dy="0">Totals reset the cumulative balance; missing values do not change it.</tspan></text></svg>