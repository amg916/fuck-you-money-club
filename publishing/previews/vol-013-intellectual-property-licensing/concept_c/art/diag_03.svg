<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>How an Inventor Royalty Rate Steps Down</title><desc>diagram id: diag-03-royalty-rate-ladder; chapter number: 3; chart type: waterfall; title: How an Inventor Royalty Rate Steps Down; subtitle: From Disney-level brand rates to the high-volume consumable floor; caption: Stephen Key and Andrew Krauss see about 5% most often, seven or eight when CAD, testing or tooling is done, over 10% only for Disney-level brands, and toward three for high-volume consumables.; assumptions note: Over 10% is plotted at 10 and seven-or-eight at 8; step sizes are the differences between the rates Key and Krauss reported. UpCounsel&#x27;s 3 to 6% of gross sales sits inside the same band.; note: Attributed to inventRightTV (Stephen Key and Andrew Krauss), with the 3 to 6% band from UpCounsel.; bars: label: Disney-level brand rate; value: 10; display: Over 10%; kind: total; label: No Disney-level brand pull; value: -2; display: Down to 7-8%; kind: deduction; label: No CAD, testing or tooling; value: -3; display: Down to about 5%; kind: deduction; label: Most common average rate; value: 5; display: About 5%; kind: result; label: High-volume consumable; value: -2; display: Drops toward 3%; kind: deduction; label: Consumable floor; value: 3; display: About 3%; kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#F8F4EC" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Palatino, Georgia, serif" font-size="28" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>How an Inventor Royalty Rate Steps Down</title><tspan x="36" dy="0">How an Inventor Royalty Rate Steps Down</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#B68D40" stroke-width="2"/><text x="36" y="139" font-family="Helvetica, sans-serif" font-size="12" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="3