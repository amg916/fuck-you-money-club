<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>The RTB Call Timing Envelope</title><desc>diagram id: diag-04-rtb-timing-envelope; chapter number: 2; chart type: horizontal_bars; title: The RTB Call Timing Envelope; subtitle: Ping, timeout and billing-pad windows practitioners configure; unit: seconds; caption: Call RTB is ping-post for live phone calls: bids return and the call routes to the best expected payout before the phone rings, with failover so an unanswered winner never kills a paid call.; assumptions note: Ping-to-route is &#x27;a couple hundred milliseconds, always under one second&#x27; (Ringba), plotted as 0.2 s typical. RingbaX values come from Ringba&#x27;s seller ring tree recipe; the 5-second timeout and 8-second pad come from ceohec&#x27;s Retreaver build. Platform defaults differ.; note: Sources: Ringba (yat7hRHHsKY, uDzWrD17wqg), ceohec (RWVdTqjVYE8).; bars: label: Ping-to-route decision; min: 0.2; max: 1; typical: 0.2; display: A couple hundred ms; always under 1 s; label: RingbaX ping timeout; min: 3; max: 3; typical: 3; display: 3,000 ms; label: Retreaver buyer timeout; min: 5; max: 5; typical: 5; display: 5 s (TTL 45); label: Connect lag and billing pad; min: 3; max: 8; typical: 8; display: 3-5 s connect lag; pad +8 s (120 s becomes 128 s); label: RingbaX dial timeout; min: 10; max: 10; typical: 10; display: 10 s</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>The RTB Call Timing Envelope</title><tspan x="36" dy="0">The RTB Call Timing Envelope</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><titl