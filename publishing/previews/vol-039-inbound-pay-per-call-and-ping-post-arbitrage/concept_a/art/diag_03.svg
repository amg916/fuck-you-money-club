<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Why the IVR Gate Protects Margin</title><desc>diagram id: diag-03-ivr-gate-margin-waterfall; chapter number: 3; chart type: waterfall; title: Why the IVR Gate Protects Margin; subtitle: TrackDrive&#x27;s 100-call example of paying on every call versus qualified calls only; caption: An IVR sorts callers on the attribute that decides payout before any buyer phone rings; paying a publisher on unqualified calls drains margin from 30% to 12.5%.; assumptions note: TrackDrive states 100 calls, 80 qualifying, a $1,200 (30%) margin falling to $500 (12.5%) when all 100 are paid. The 20 non-qualifying calls and the $700 gap are arithmetic on those stated figures. Ringba&#x27;s debt IVR forwards only callers with more than $10,000 in unsecured credit card debt.; note: Sources: TrackDrive (yYZ5s6jFzQs), Ringba / Jordan Soto (4dnXkZ7u6zw), Carlos Corona (tf4AieS7Mhc).; bars: label: Calls entering the IVR; value: 100; display: 100 calls; kind: total; label: Calls failing qualification; value: 20; display: -20 calls; kind: deduction; label: Qualified calls forwarded; value: 80; display: 80 calls; kind: result; label: Margin paying qualified calls only; value: 1200; display: $1,200 (30%); kind: total; label: Payout leaked on unqualified calls; value: 700; display: -$700; kind: deduction; label: Margin paying on all calls; value: 500; display: $500 (12.5%); kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Why the IVR Gate Protects Margin</title><tspan x="36" dy="0">Why the IVR Gate Protects Margin</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#1417