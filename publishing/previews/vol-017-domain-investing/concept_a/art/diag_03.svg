; the $3 final-day drop is the gap between the day 4 price and the stated $5 floor.</title><tspan x="36" dy="0">Assumptions: Daily steps assume the 5-day Closeout window starting day 36 as mapped by the GoDaddy panel; the $3 final-day drop is</tspan><tspan x="36" dy="13.75">the gap between the day 4 price and the stated $5 floor.</tspan></text><text x="36" y="592" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Totals reset the cumulative balance; missing values do not change it.</title><tspan x="36" dy="0">Totals reset the cumulative balance; missing values do not change it.</tspan></text></svg>