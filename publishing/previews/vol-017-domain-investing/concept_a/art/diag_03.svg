<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>GoDaddy Closeout Buy-Now Price Decay</title><desc>diagram id: diag-03-closeout-price-decay; chapter number: 3; title: GoDaddy Closeout Buy-Now Price Decay; subtitle: How the 5-day declining Closeout bottoms at $5; chart type: waterfall; bars: label: Closeout Opening Buy-Now; value: 11; display: $11; kind: total; label: Day 2 Markdown; value: -1; display: -$1; kind: deduction; label: Day 3 Markdown; value: -1; display: -$1; kind: deduction; label: Day 4 Markdown; value: -1; display: -$1; kind: deduction; label: Final-Day Drop; value: -3; display: -$3; kind: deduction; label: Final-Day Price; value: 5; display: $5; kind: result; caption: GoDaddy&#x27;s Closeout buy-now starts at $11, drops $1 a day, then sits at $5 on the final day, after the 10-day auction that opens on day 26 of the expiry cycle.; assumptions note: Daily steps assume the 5-day Closeout window starting day 36 as mapped by the GoDaddy panel; the $3 final-day drop is the gap between the day 4 price and the stated $5 floor.; note: Sources GoDaddy (0f-o9p0h6u8 @ 00:09:23) for the closeout pricing and GoDaddy (OM_5VESPepY @ 00:22:17) for the drop-cycle timing.</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>GoDaddy Closeout Buy-Now Price Decay</title><tspan x="36" dy="0">GoDaddy Closeout Buy-Now Price Decay</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><line x1="154" y1="162" x2="154" y2="512" stroke="#D8CEBE" stroke-width="