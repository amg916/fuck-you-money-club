<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>How a Verified List Leaks Before the First Send</title><desc>diagram id: diag-03-verified-list-leakage-waterfall; chapter number: 3; title: How a Verified List Leaks Before the First Send; subtitle: 1,000 verified Apollo leads checked against a live campaign and a match-flag review; chart type: waterfall; bars: label: Verified Apollo Leads; value: 1000; display: 1,000; kind: total; label: Invalid Share Implied by 91% Claim; value: 90; display: -90; kind: deduction; label: Extra Bounces in the Live Run; value: 180; display: -180; kind: deduction; label: Measured Accurate Emails (73%); value: 730; display: 730; kind: total; label: Off-Criteria Rate at 20% (Evaboot); value: 146; display: -146; kind: deduction; label: Accurate and On-Criteria; value: 584; display: 584; kind: result; caption: Prospeo measured 73% accuracy against Apollo&#x27;s claimed 91%, and Evaboot flags at least 20% of Sales Navigator results as off-criteria.; assumptions note: The 90 and 180 split is arithmetic on Prospeo&#x27;s 91% claimed versus 73% measured accuracy (over 270 bounced). Stacking Evaboot&#x27;s at-least-20% rate on the 730 survivors combines two cited figures and is illustrative, not one reported run.; note: Sources - Prospeo (QnSW0B2oztg @ 00:09:46), JB - Evaboot (rryPKFY2BRI @ 00:05:44).</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>How a Verified List Leaks Before the First Send</title><tspan x="59" dy="0">How a Verified List Leaks Before the First Send</tspan></text><text x="36"