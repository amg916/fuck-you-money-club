<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>USIS Dumping Case Recovery Walk</title><desc>diagram id: diag-03-usis-recovery-walk; chapter number: 3; chart type: waterfall; title: USIS Dumping Case Recovery Walk; subtitle: How an intervened settlement splits, and what declining severance preserved; caption: Blake Percival took 20 percent of an about $30M intervened settlement, about $6M, after turning down $42,000 in severance that carried a fine-print waiver of whistleblower rights.; assumptions note: Result bars are straight subtraction of the quoted figures; counsel contingency fees and taxes were not quantified by the practitioners and are excluded.; note: Source: Whistleblower Heroes (Blake Percival, FopC1sCa2y8).; bars: label: USIS settlement; value: 30000000; display: about $30M; kind: total; label: Percival relator share (20%); value: 6000000; display: -about $6M; kind: deduction; label: Retained by the government; value: 24000000; display: about $24M; kind: result; label: Percival gross relator payout; value: 6000000; display: about $6M; kind: total; label: Severance declined to keep rights; value: 42000; display: -$42,000; kind: deduction; label: Net versus signing the waiver; value: 5958000; display: about $5.96M before fees; kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>USIS Dumping Case Recovery Walk</title><tspan x="59" dy="0">USIS Dumping Case Recovery Walk</tspan></text><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#09090B" text-anchor="start" style="font