<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Where $1,500 in Weekly Fares Goes on a Fleet Car</title><desc>diagram id: diag-03-fleet-car-weekly-margin-waterfall; chapter number: 3; chart type: waterfall; title: Where $1,500 in Weekly Fares Goes on a Fleet Car; subtitle: Uber commission and driver share leave the owner $225 per vehicle; caption: Owners Risk models a small fleet where $1,500 in weekly fares loses 25% to Uber and $900 to the driver, leaving $225 per car and about $4,500 per month across five cars, with the warning that Uber&#x27;s algorithm controls the margin.; assumptions note: Gross, commission rate, driver share, per-car net, and five-car monthly net are as stated by Owners Risk; the $375 commission and $1,125 subtotal are arithmetic on those figures. The final bar is on a monthly, five-car basis.; note: Owners Risk (oDmpBy9CTek @ 00:07:27).; bars: label: Weekly gross fares; value: 1500; display: $1,500; kind: total; label: Uber commission at 25%; value: -375; display: -$375; kind: deduction; label: After Uber commission; value: 1125; display: $1,125; kind: total; label: Driver keeps; value: -900; display: -$900; kind: deduction; label: Owner net per car per week; value: 225; display: $225; kind: result; label: Five-car owner net per month; value: 4500; display: About $4,500; kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Where $1,500 in Weekly Fares Goes on a Fleet Car</title><tspan x="36" dy="0">Where $1,500 in Weekly Fares Goes on a Fleet Car</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-