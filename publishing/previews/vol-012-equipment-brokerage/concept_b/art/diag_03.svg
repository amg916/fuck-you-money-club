<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Winning Below the Comps</title><desc>diagram id: diag-03-cascadia-auction-win-waterfall; chapter number: 3; title: Winning Below the Comps; subtitle: A 2023 Cascadia bought online at Ritchie Bros.; chart type: waterfall; bars: label: Bid Agent valuation (top); value: 87000; display: $87,000; kind: total; label: Gap to $85k comp; value: 2000; display: -$2,000; kind: deduction; label: Gap to $82k comp; value: 3000; display: -$3,000; kind: deduction; label: Gap to $81k comp; value: 1000; display: -$1,000; kind: deduction; label: Discount below lowest comp; value: 5000; display: -$5,000; kind: deduction; label: Hammer price won; value: 76000; display: $76,000; kind: result; caption: The 572,000 km unit closed at $76,000 against comps of $85k, $82k, and $81k, while a favored 361k-km unit ran to $102k and was abandoned.; assumptions note: Bid Agent valued the unit at $86k to $87k; the top of that range is the starting bar. Bar gaps are arithmetic between reported figures. Buyer&#x27;s premiums of 12-19%, a 10% auction fee plus 13% HST, and a 3-4% card surcharge sit outside this hammer comparison.; note: Source - Ronin of ET Transport, using the Bid Agent Chrome extension and a $500,000 Ritchie credit line; the buyer claimed &#x27;$10,000&#x27; made.</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Winning Below the Comps</title><tspan x="59" dy="0">Winning Below the Comps</tspan></text><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#09090B" text-an