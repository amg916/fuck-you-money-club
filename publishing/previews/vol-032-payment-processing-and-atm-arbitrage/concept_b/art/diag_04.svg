<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Effective Rate Yardsticks for Reading Any Statement</title><desc>diagram id: diag-04-effective-rate-yardsticks; chapter number: 2; title: Effective Rate Yardsticks for Reading Any Statement; subtitle: Benchmarks practitioners use to spot overpaying merchants; chart type: horizontal_bars; unit: % of card volume; bars: label: US interchange effective rate; min: 1.6; max: 1.8; typical: 1.7; display: 1.6% to 1.8%, about 1.7% average; label: Effective rate at $100K monthly volume; min: 1.5; max: 1.5; typical: 1.5; display: Under 1.5%; label: Square or Stripe flat rate; min: 2.5; max: 2.9; typical: 2.9; display: 2.5% or 2.9%; label: Coffee shop flat rate that lost money; min: 3.5; max: 3.5; typical: 3.5; display: 3.5% flat; label: Uncompetitive markup at $20K to $40K; min: 0.7; max: 0.7; typical: 0.7; display: Above about 0.7% markup; caption: Total interchange divided by volume should land near 1.7%, and total fees minus interchange exposes the real markup.; assumptions note: The 1.7% average was stated as of May 2019; single-point bars reflect thresholds quoted without a range.; note: Sources include CCSalesPro, Helcim, and Bryan Manning of BancardSales, who calls the effective rate the only undisputed yardstick.</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Effective Rate Yardsticks for Reading Any Statement</title><tspan x="59" dy="0">Effective Rate Yardsticks for Reading Any Statement</tspan></text><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><line x1="232.0" y1="166" x2="232.0" y2="480" stroke="#18181B" stroke-width="1"/><text x="42" y="208.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>US interchange effective rate</title><tspan x="42" dy="0">US interchange</tspan><tspan x="42" dy="16.25">effective rate</tspan></text><text x="956" y="208.6" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#09090B" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="42" y="269.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Effective rate at $100K monthly volume</title><tspan x="42" dy="0">Effective rate at $100K</tspan><tspan x="42" dy="16.25">monthly volume</tspan></text><text x="956" y="269.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#09090B" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="42" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Square or Stripe flat rate</title><tspan x="42" dy="0">Square or Stripe flat</tspan><tspan x="42" dy="16.25">rate</tspan></text><text x="956" y="331.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#09090B" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="42" y="392.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Coffee shop flat rate that lost money</title><tspan x="42" dy="0">Coffee shop flat rate</tspan><tspan x="42" dy="16.25">that lost money</tspan></text><text x="956" y="392.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#09090B" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="42" y="453.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Uncompetitive markup at $20K to $40K</title><tspan x="42" dy="0">Uncompetitive markup at</tspan><tspan x="42" dy="16.25">$20K to $40K</tspan></text><text x="956" y="453.4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#09090B" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="232" y="502" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Scale: 0 to 0 % of card volume</title><tspan x="232" dy="0">Scale: 0 to 0 % of card volume</tspan></text><line x1="36" y1="535" x2="964" y2="535" stroke="#18181B" stroke-width="3"/><text x="36" y="556" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Assumptions: The 1.7% average was stated as of May 2019; single-point bars reflect thresholds quoted without a range.</title><tspan x="36" dy="0">Assumptions: The 1.7% average was stated as of May 2019; single-point bars reflect thresholds quoted without a range.</tspan></text><text x="36" y="592" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#09090B" text-anchor="start" style="font-variant-numeric:tabular-nums"><title></title><tspan x="36" dy="0"></tspan></text></svg>