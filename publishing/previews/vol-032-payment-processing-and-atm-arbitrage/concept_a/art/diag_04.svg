<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Effective Rate Yardsticks for Reading Any Statement</title><desc>diagram id: diag-04-effective-rate-yardsticks; chapter number: 2; title: Effective Rate Yardsticks for Reading Any Statement; subtitle: Benchmarks practitioners use to spot overpaying merchants; chart type: horizontal_bars; unit: % of card volume; bars: label: US interchange effective rate; min: 1.6; max: 1.8; typical: 1.7; display: 1.6% to 1.8%, about 1.7% average; label: Effective rate at $100K monthly volume; min: 1.5; max: 1.5; typical: 1.5; display: Under 1.5%; label: Square or Stripe flat rate; min: 2.5; max: 2.9; typical: 2.9; display: 2.5% or 2.9%; label: Coffee shop flat rate that lost money; min: 3.5; max: 3.5; typical: 3.5; display: 3.5% flat; label: Uncompetitive markup at $20K to $40K; min: 0.7; max: 0.7; typical: 0.7; display: Above about 0.7% markup; caption: Total interchange divided by volume should land near 1.7%, and total fees minus interchange exposes the real markup.; assumptions note: The 1.7% average was stated as of May 2019; single-point bars reflect thresholds quoted without a range.; note: Sources include CCSalesPro, Helcim, and Bryan Manning of BancardSales, who calls the effective rate the only undisputed yardstick.</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Effective Rate Yardsticks for Reading Any Statement</title><tspan x="36" dy="0">Effective Rate Yardsticks for Reading Any Statement</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><line x1="154" y1="162" x2="154" y2="512" stroke="#D8CEBE" stroke-width="1"/><text x="36" y="184" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>PLATE</title><tspan x="36" dy="0">PLATE</tspan></text><text x="36" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>horizontal bars</title><tspan x="36" dy="0">horizontal</tspan><tspan x="36" dy="15.0">bars</tspan></text><line x1="370.0" y1="166" x2="370.0" y2="480" stroke="#D8CEBE" stroke-width="1"/><text x="180" y="208.6" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>US interchange effective rate</title><tspan x="180" dy="0">US interchange</tspan><tspan x="180" dy="16.25">effective rate</tspan></text><text x="956" y="208.6" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="269.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Effective rate at $100K monthly volume</title><tspan x="180" dy="0">Effective rate at $100K</tspan><tspan x="180" dy="16.25">monthly volume</tspan></text><text x="956" y="269.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="331.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Square or Stripe flat rate</title><tspan x="180" dy="0">Square or Stripe flat</tspan><tspan x="180" dy="16.25">rate</tspan></text><text x="956" y="331.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="392.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Coffee shop flat rate that lost money</title><tspan x="180" dy="0">Coffee shop flat rate</tspan><tspan x="180" dy="16.25">that lost money</tspan></text><text x="956" y="392.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="453.4" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Uncompetitive markup at $20K to $40K</title><tspan x="180" dy="0">Uncompetitive markup at</tspan><tspan x="180" dy="16.25">$20K to $40K</tspan></text><text x="956" y="453.4" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="370" y="502" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Scale: 0 to 0 % of card volume</title><tspan x="370" dy="0">Scale: 0 to 0 % of card volume</tspan></text><line x1="36" y1="535" x2="964" y2="535" stroke="#D8CEBE" stroke-width="1"/><text x="36" y="556" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Assumptions: The 1.7% average was stated as of May 2019; single-point bars reflect thresholds quoted without a range.</title><tspan x="36" dy="0">Assumptions: The 1.7% average was state