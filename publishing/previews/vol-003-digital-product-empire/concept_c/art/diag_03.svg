<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Separate Sale Price, Proceeds, and Commission</title><desc>diagram id: diag-03-template-checkout-money-checkpoints; chapter number: 3; title: Separate Sale Price, Proceeds, and Commission; subtitle: Reported checkout examples clarify what a template seller can compare without treating commission as the full cost.; caption: Stack Receipts reports a $20 domestic-card sale leaving $18.50 through Lemon Squeezy or $18.12 through Payhip Free after Stripe. Smart Capital reports a $2.90 Gumroad commission on a $29 template before processing.; assumptions note: Each total starts an independent checkout example. Stack Receipts supplies the proceeds directly; no intermediate fee amounts are estimated. Smart Capital&#x27;s final deduction is commission only, and no Gumroad net payout is asserted.; note: These Stack Receipts and Smart Capital storefront examples apply to template checkout planning. Job4all separately reports Notion Marketplace charges of 8% plus $0.40; those charges must not be applied to these other platforms.; chart type: waterfall; bars: label: Lemon Squeezy sale; value: 20; display: $20; kind: total; label: Lemon Squeezy proceeds; value: 18.5; display: $18.50; kind: result; label: Payhip Free sale; value: 20; display: $20; kind: total; label: Payhip proceeds after Stripe; value: 18.12; display: $18.12; kind: result; label: Gumroad template sale; value: 29; display: $29; kind: total; label: Gumroad commission only; value: 2.9; display: $2.90 deducted before processing; kind: deduction</desc><rect x="0" y="0" width="1000" height="620" fill="#F8F4EC" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Palatino, Georgia, serif" font-size="28" fill="#1D2421" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Separate Sale Price, Proceeds, and Commission</title><tspan x="36" dy="0">Separate Sale Price, Proceeds, and Commission</tspan></text><line x