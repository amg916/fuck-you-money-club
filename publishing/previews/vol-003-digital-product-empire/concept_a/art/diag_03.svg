; value: 18.5; display: $18.50; kind: result</title></rect><text x="373.00000000000006" y="373.79211205307774" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>18.5</title><tspan x="373.00000000000006" dy="0">18.5</tspan></text><text x="373.00000000000006" y="499" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>Lemon Squeezy proceeds</title><tspan x="373.00000000000006" dy="0">Lemon Squeezy</tspan><tspan x="373.00000000000006" dy="13.75">proceeds</tspan></text><line x1="428.6666666666667" y1="382.79211205307774" x2="446.6666666666667" y2="382.79211205307774" stroke="#D8CEBE" stroke-width="1"/><rect x="446.6666666666667" y="332.29450792480645" width="111.33333333333334" height="50.49760412827129" fill="#F2ECE0" stroke="#8C6D32" stroke-width="1"><title>label: Payhip Free sale; value: 20; display: $20; kind: total</title></rect><text x="502.33333333333337" y="323.29450792480645" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>20</title><tspan x="502.33333333333337" dy="0">20</tspan></text><text x="502.33333333333337" y="499" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>Payhip Free sale</title><tspan x="502.33333333333337" dy="0">Payhip Free sale</tspan></text><line x1="558.0" y1="332.29450792480645" x2="576.0" y2="332.29450792480645" stroke="#D8CEBE" stroke-width="1"/><rect x="576.0" y="286.5436785845927" width="111.33333333333334" height="45.75082934021373" fill="#F2ECE0" stroke="#8C6D32" stroke-width="1"><title>label: Payhip proceeds after Stripe; value: 18.12; display: $18.12; kind: result</title></rect><text x="631.6666666666666" y="277.5436785845927" font-family="Arial, Helvetica, sans-ser