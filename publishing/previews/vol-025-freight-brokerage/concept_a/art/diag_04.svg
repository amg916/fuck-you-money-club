<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>What Broker Authority Actually Costs</title><desc>diagram id: diag-04-authority-cost-ranges; chapter number: 2; title: What Broker Authority Actually Costs; subtitle: Reported cost ranges for filing, process agent, UCR, bond premium and all-in launch; chart type: horizontal_bars; unit: USD; caption: Authority is $300 per type, but the bond premium swings from $900 to $9,000 on owner credit and dominates the all-in launch bill.; assumptions note: The &#x27;typical&#x27; marker is a practitioner-named anchor where one exists (Scott&#x27;s $3,000 quote, Krause&#x27;s $3,500 band edge); otherwise it is the upper end of the reported range.; note: Sources - The Broker Intellect (5TtQ4-VoZuI), Truckers Authority (jyVHYDl8PgQ), Matt Krause (afV63okbAMs, hhT4X32MspU) and Brandon Scott (lzC0i5OReRU).; bars: label: Application fee per authority; min: 300; max: 300; typical: 300; display: $300 per authority type; $0 paid means only a DOT number; label: UCR filing; min: 46; max: 46; typical: 46; display: $46; label: Process agent (BOC-3); min: 20; max: 100; typical: 100; display: $20-$100; must cover every operating state; label: BMC-84 bond premium; min: 900; max: 9000; typical: 3000; display: $900-$9,000 by owner credit; label: All-in authority launch; min: 2500; max: 4500; typical: 3500; display: $2,500-$3,500; up to $4,500 with weaker credit</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>What Broker Authority Actually Costs</title><tspan x="36" dy="0">What Broker Authority Actually Costs</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anc