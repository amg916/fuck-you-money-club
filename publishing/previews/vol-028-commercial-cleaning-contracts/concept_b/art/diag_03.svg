<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>100 Cold Calls Down to 2 Walkthroughs</title><desc>diagram id: diag-03-cold-call-attrition-waterfall; chapter number: 3; chart type: waterfall; title: 100 Cold Calls Down to 2 Walkthroughs; subtitle: Cold calling opens a door rather than closing a deal; caption: Carolyn Arellano&#x27;s funnel turns 100 calls into 20-30 reached, 10-15 conversations, 3-5 qualified and 1-2 walkthroughs; 8 walkthroughs a month at a 25% close rate equal 2 contracts a month.; assumptions note: Bars use the upper end of each stated range (30 reached, 15 conversations, 5 qualified, 2 walkthroughs). Deductions are the gaps between those stated stages.; note: Source Carolyn Arellano (xJ6TUBTc4Qo at 00:01:58 and 00:03:26).; bars: label: Cold calls dialed; value: 100; display: 100 calls; kind: total; label: Never reached; value: 70; display: -70 (20-30 reached); kind: deduction; label: Reached, no conversation; value: 15; display: -15 (10-15 conversations); kind: deduction; label: Conversation, not qualified; value: 10; display: -10 (3-5 qualified); kind: deduction; label: Qualified, no walkthrough; value: 3; display: -3 (1-2 walkthroughs); kind: deduction; label: Walkthroughs booked; value: 2; display: 1-2 walkthroughs; kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>100 Cold Calls Down to 2 Walkthroughs</title><tspan x="59" dy="0">100 Cold Calls Down to 2 Walkthroughs</tspan></text><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#09090B" text-anchor="start