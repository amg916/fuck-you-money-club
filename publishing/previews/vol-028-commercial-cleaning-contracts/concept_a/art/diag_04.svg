<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>The Percentages Behind the First Contract</title><desc>diagram id: diag-04-first-contract-percentages; chapter number: 2; chart type: horizontal_bars; title: The Percentages Behind the First Contract; subtitle: Won on dependability and margin discipline, not the lowest bid; unit: percent; caption: Roughly 90% of commercial prospects already have a cleaner; refusing to be the cheapest bid lifted one closing rate from 10% to 25-35%, while margin floors sit at 30% with about 25% for strategic accounts.; assumptions note: Where a practitioner gave a range without a typical value, typical is the midpoint of that range. Single-point claims use the same figure for min, max and typical.; note: Sources Cleaning Launch (V84a_KWRYU4 at 00:01:22); ONLY MAIDS PODCAST with Joseph D Adams (aQj7G__L-iE at 00:07:34 and 00:08:41); OctoClean Media (1tf8JMWxi98 at 00:00:44).; bars: label: Prospects already with a cleaner; min: 90; max: 90; typical: 90; display: About 90%; label: Close rate competing as cheapest; min: 10; max: 10; typical: 10; display: 10% (Cleaning Launch, before); label: Close rate refusing cheapest; min: 25; max: 35; typical: 30; display: 25-35% (Cleaning Launch, after); label: Target contract margin; min: 25; max: 30; typical: 30; display: 30% standard, about 25% strategic (Adams); label: Price float when budget stalls; min: 25; max: 30; typical: 27.5; display: 25-30% higher number (OctoClean Media)</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>The Percentages Behind the First Contract</title><tspan x="36" dy="0">The Percentages Behind the First Contract</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><line x1="154" y1="162" x2="154" y2="512" stroke="#D8CEBE" stroke-width="1"/><text x="36" y="184" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>PLATE</title><tspan x="36" dy="0">PLATE</tspan></text><text x="36" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>horizontal bars</title><tspan x="36" dy="0">horizontal</tspan><tspan x="36" dy="15.0">bars</tspan></text><line x1="370.0" y1="166" x2="370.0" y2="480" stroke="#D8CEBE" stroke-width="1"/><text x="180" y="208.6" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Prospects already with a cleaner</title><tspan x="180" dy="0">Prospects already with</tspan><tspan x="180" dy="16.25">a cleaner</tspan></text><text x="956" y="208.6" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="269.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Close rate competing as cheapest</title><tspan x="180" dy="0">Close rate competing as</tspan><tspan x="180" dy="16.25">cheapest</tspan></text><text x="956" y="269.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="331.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" tex