nge. Single-point claims use the same figure for min, max and typical.</title><tspan x="36" dy="0">Assumptions: Where a practitioner gave a range without a typical value, typical is the midpoint of that range. Single-point claims</tspan><tspan x="36" dy="13.75">use the same figure for min, max and typical.</tspan></text><text x="36" y="592" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title></title><tspan x="36" dy="0"></tspan></text></svg>