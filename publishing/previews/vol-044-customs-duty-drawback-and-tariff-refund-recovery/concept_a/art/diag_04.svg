<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Drawback Claim Economics in Percent</title><desc>diagram id: diag-04-drawback-claim-economics-bands; chapter number: 2; title: Drawback Claim Economics in Percent; subtitle: Refund rate, unclaimed share, matching uplift and partner incentive; caption: Drawback returns 99% of eligible duties, taxes and fees. Most of the pool goes unclaimed, and optimal substitution matching can lift recovery well beyond greedy logic.; assumptions note: All values are percentages reported by the named speakers. Where a speaker gave a single figure, min, max and typical are equal. Section 232, AD/CVD and over-quota duties are excluded from recovery.; note: Sources are Thompson Hine LLP (Aaron Mandelbaum), Flexport (Monica Pascarella and the drawback team), USA Customs Clearance and World Trade Center Denver.; chart type: horizontal_bars; unit: percent; bars: label: Refund rate on eligible duties, taxes and fees; min: 99; max: 99; typical: 99; display: 99%; label: Retained by customs for administrative fees; min: 1; max: 1; typical: 1; display: 1%; label: Share of eligible drawback left unclaimed; min: 70; max: 80; typical: 70; display: About 70% (Flexport) to 70-80% (USA Customs Clearance); label: Optimized substitution matching uplift; min: 10; max: 400; typical: 35; display: 10-400%, about 35% average; label: Partner cooperation incentive per claim; min: 10; max: 10; typical: 10; display: Something like 10% per claim</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Drawback Claim Economics in Percent</title><tspan x="36" dy="0">Drawback Claim Economics in Percent</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><line x1="154" y1="162" x2="154" y2="512" stroke="#D8CEBE" stroke-width="1"/><text x="36" y="184" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>PLATE</title><tspan x="36" dy="0">PLATE</tspan></text><text x="36" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>horizontal bars</title><tspan x="36" dy="0">horizontal</tspan><tspan x="36" dy="15.0">bars</tspan></text><line x1="370.0" y1="166" x2="370.0" y2="480" stroke="#D8CEBE" stroke-width="1"/><text x="180" y="208.6" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Refund rate on eligible duties, taxes and fees</title><tspan x="180" dy="0">Refund rate on eligible</tspan><tspan x="180" dy="16.25">duties, taxes and fees</tspan></text><text x="956" y="208.6" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="269.8" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Retained by customs for administrative fees</title><tspan x="180" dy="0">Retained by customs for</tspan><tspan x="180" dy="16.25">administrative fees</tspan></text><text x="956" y="269.8" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="331.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Share of eligible drawback left unclaimed</title><tspan x="180" dy="0">Share of eligible</tspan><tspan x="180" dy="16.25">drawback left unclaimed</tspan></text><text x="956" y="331.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="392.2" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Optimized substitution matching uplift</title><tspan x="180" dy="0">Optimized substitution</tspan><tspan x="180" dy="16.25">matching uplift</tspan></text><text x="956" y="392.2" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="180" y="453.4" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Partner cooperation incentive per claim</title><tspan x="180" dy="0">Partner cooperation</tspan><tspan x="180" dy="16.25">incentive per claim</tspan></text><text x="956" y="453.4" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="end" style="font-variant-numeric:tabular-nums"><title>N/A</title><tspan x="956" dy="0">N/A</tspan></text><text x="370" y="502" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Scale: 0 to 0 percent</title><tspan x="370" dy="0">Scale: 0 to 0 percent</tspan></text><line x1="36" y1="535" x2="964" y2="535" stroke="#D8CEBE" stroke-width="1"/><text x="36" y="556" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Assumptions: All values are percentages reported by the named speakers. Where a speaker gave a single figure, min, max and typical are equal. Section 232, AD/CVD and over-quota duties are excluded from recovery.</title><tspan x="36" dy="0">Assumptions: All values are percentages reported by the named speakers. Where a speaker gave a single figure, min, max and typical</tspan><tspan x="36" dy="13.75">are equal. Section 232, AD/CVD and over-quota duties are excluded from recovery.</tspan></text><text x="36" y="592" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title></title><tspan x="36" dy="0"></tspan></text></svg>