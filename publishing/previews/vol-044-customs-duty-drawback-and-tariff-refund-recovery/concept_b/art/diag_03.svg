<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>IEEPA Refund Pipeline Walk</title><desc>diagram id: diag-03-ieepa-refund-pipeline-walk; chapter number: 3; title: IEEPA Refund Pipeline Walk; subtitle: From the $166B collected to accepted, certified and paid refunds; caption: Refunds go only to the importer of record, through CAPE inside ACE, by ACH with interest. Billions remain outside the pipeline or stuck on missing bank details.; assumptions note: Values are in USD billions. Each bar is a separately reported snapshot drawn from CBP court filings, so the bars do not add up exactly. Accepted and certified figures are as of October 2. The paid figure is an earlier snapshot from July 31.; note: Sources are Tariffs Lawsuit (Michael Watson), the PolitiClash scoreboard, Finn&#x27;s Fine Print and Trade Winds Report.; chart type: waterfall; unit: USD billions; bars: label: IEEPA duties paid by 330,000+ importers; value: 166.0; display: About $166B; kind: total; label: Not yet in the CAPE pipeline; value: 29.0; display: About $29B; kind: deduction; label: Declarations accepted; value: 136.6; display: About $136.6B; kind: result; label: Trapped pending ACH bank details; value: 0.737; display: About $737M; kind: deduction; label: Certified to Treasury including interest; value: 126.0; display: About $126B; kind: result; label: Paid through CAPE by July 31; value: 100.0; display: $100B; kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>IEEPA Refund Pipeline Walk</title><tspan x="59" dy="0">IEEPA Refund Pipeline Wa