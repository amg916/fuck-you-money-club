<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>What a Laser Really Costs</title><desc>diagram id: diag-03-laser-exposure-waterfall; chapter number: 3; chart type: waterfall; title: What a Laser Really Costs; subtitle: Named-claimant exposure above the specific deductible, and the ag-spec counter; caption: A $600,000 laser over a $150,000 specific deductible quietly adds up to $450,000 of exposure, while a near-spec laser can be traded away with an aggregating specific.; assumptions note: The $25,000 gap is arithmetic on the $125,000 laser and $100,000 specific deductible cited by Spencer Smith. Carriers often accept the $50,000 ag spec trade only when the laser sits that close to the spec.; note: Sources are Benefit Whisperer (6E1eObzSNLc at 00.01.05) and Spencer Smith of Self-Funded (VatFfWseBbI at 00.07.48).; bars: label: Laser on Named Claimant; value: 600000; display: $600,000; kind: total; label: Standard Specific Deductible; value: 150000; display: -$150,000; kind: deduction; label: Extra Exposure From Laser; value: 450000; display: $450,000; kind: result; label: Laser on Near-Spec Claimant; value: 125000; display: $125,000; kind: total; label: Underlying Specific Deductible; value: 100000; display: -$100,000; kind: deduction; label: Gap Traded for $50k Ag Spec; value: 25000; display: $25,000; kind: result</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>What a Laser Really Costs</title><tspan x="36" dy="0">What a Laser Really Costs</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><t