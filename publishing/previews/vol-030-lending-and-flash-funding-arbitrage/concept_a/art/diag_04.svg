int spans Lex Levinrad at $10,000, Brent Daniels at $15,000 and Jamil Damji at $20,000.</title><tspan x="36" dy="0">Assumptions: Where no single figure was cited, the typical marker is the range midpoint. The switch point spans Lex Levinrad at</tspan><tspan x="36" dy="13.75">$10,000, Brent Daniels at $15,000 and Jamil Damji at $20,000.</tspan></text><text x="36" y="592" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title></title><tspan x="36" dy="0"></tspan></text></svg>