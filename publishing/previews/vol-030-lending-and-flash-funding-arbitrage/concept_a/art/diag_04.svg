<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>What a Double Close Costs Versus an Assignment</title><desc>diagram id: diag-04-assign-vs-double-close-costs; chapter number: 2; chart type: horizontal_bars; title: What a Double Close Costs Versus an Assignment; subtitle: Funding fees, closing hits and the spread where operators switch; caption: Assignment is the cheap default exit; operators switch to a double close only when the spread is fat enough to absorb two closings and a funding fee.; assumptions note: Where no single figure was cited, the typical marker is the range midpoint. The switch point spans Lex Levinrad at $10,000, Brent Daniels at $15,000 and Jamil Damji at $20,000.; note: Attributed to Michael (The Virtual Investor), Brent Daniels (Wholesaling Inc), David Olds REI, Jamil Damji and Lex Levinrad.; unit: USD; bars: label: Funding fee on a $100,000 loan; min: 1000; max: 3000; typical: 2000; display: $1,000-$3,000 (1% to 3%); label: Flat transactional funding quotes; min: 1500; max: 5000; typical: 3250; display: $1,500-$5,000 flat; label: Purchase-side closing cost hit; min: 2500; max: 4000; typical: 3250; display: $2,500-$4,000 plus 1%-2% origination; label: Profit lost to title on a double close; min: 6000; max: 7000; typical: 6000; display: $14,000 net vs $20,000 assigned; label: Double-close switch point; min: 10000; max: 20000; typical: 15000; display: $10,000-$20,000 spread</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>What a Double Close Costs Versus an Assignment</title><tspan x="36" dy="0">What a Double Close Costs Versus an Assignment</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-