<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>What Government Iron Actually Hammered For</title><desc>diagram id: diag-03-sold-price-step-down; chapter number: 3; title: What Government Iron Actually Hammered For; subtitle: Reported sold prices from GSA, Florida, and New Hampshire surplus lots; chart type: waterfall; bars: label: 2021 Explorer, under 50,000 miles; value: 15000; display: $15,000; kind: total; label: 2018 Silverado; value: 6750; display: $6,750; kind: deduction; label: 55,000-mile Merrimack unit; value: 6500; display: $6,500; kind: deduction; label: Ex-cop Chargers and Impalas; value: 4000; display: $3,000 to $4,000; kind: deduction; label: 2014 Silverado and 2012 Chevrolet; value: 3200; display: $3,200; kind: deduction; label: 2008 Malibu; value: 2800; display: $2,800; kind: result; caption: Fleets retire units on mileage or age with mandated maintenance, so government-titled units are the preferred buy; fees ran from zero at the GSA Orlando sale to 2% on some agency lots.; assumptions note: Each bar is a standalone reported hammer price stepping down from the highest to the lowest; bars are not arithmetic deductions from one another. The Chargers and Impalas bar is plotted at the top of the reported range.; note: Attributed to Auction Reviews With Jeff (YaIalHq0RVU, P82Ir2OeO50), Retired and Winging it (pl4wTzpNWRQ), and Sean Drake (ovCY1VA7klw).</desc><rect x="0" y="0" width="1000" height="620" fill="#FFFFFF" stroke="none" stroke-width="1"></rect><rect x="0" y="0" width="1000" height="114" fill="#09090B" stroke="none" stroke-width="1"></rect><rect x="32" y="24" width="12" height="66" fill="#FFD400" stroke="none" stroke-width="1"></rect><text x="59" y="52" font-family="&#x27;Arial Narrow&#x27;, Impact, sans-serif" font-size="29" fill="#FAF8F2" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>What Government Iron Actually Hammered For</title><tspan x="59" dy="0">What Government Iron Actually Hamm