<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>Success-Fee Ranges by Intermediary Type</title><desc>diagram id: diag-04-success-fee-ladders; chapter number: 2; title: Success-Fee Ranges by Intermediary Type; subtitle: Main Street percentages versus sliding ladders on larger deals; caption: Main Street brokers charge 10-15% with nothing upfront. M&amp;A advisors slide from 10% down to 2% on the double Lehman, and digital marketplaces taper by deal size.; assumptions note: The typical value is the practitioner&#x27;s stated example or a stated middle tier, not an average. Ladders apply each rate to a portion of the price.; note: Sources are American Business Intermediaries, CompassPointCapital (Nate Grant), Business Broker Crowd Call, Colin Matcha, and Business Solution.; chart type: horizontal_bars; unit: % of purchase price; bars: label: Main Street Business Broker; min: 10; max: 15; typical: 12; display: 10-15% (12% with $20K minimum); label: M&amp;A Advisor Double Lehman; min: 2; max: 10; typical: 6; display: 10/8/6/4/2% by million; label: Larger Main Street Deal Ladder; min: 6; max: 10; typical: 8; display: 10/9/8/7/6% ladder; label: Quiet Light Digital Ladder; min: 9; max: 10; typical: 10; display: 10% first $1M, 9% next $500K; label: Empire Flippers Tiered Fee; min: 2.5; max: 15; typical: 8; display: 15% / 8% / 2.5%, $7K minimum</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Success-Fee Ranges by Intermediary Type</title><tspan x="36" dy="0">Success-Fee Ranges by Intermediary Type</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric: