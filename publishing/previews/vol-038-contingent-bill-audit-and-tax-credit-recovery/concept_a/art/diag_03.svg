trained Discount; value: 22; display: ~22% effective; kind: result</title></rect><text x="890.3333333333334" y="197.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>22</title><tspan x="890.3333333333334" dy="0">22</tspan></text><text x="890.3333333333334" y="499" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>LJM Constrained Discount</title><tspan x="890.3333333333334" dy="0">LJM Constrained</tspan><tspan x="890.3333333333334" dy="13.75">Discount</tspan></text><line x1="36" y1="535" x2="964" y2="535" stroke="#D8CEBE" stroke-width="1"/><text x="36" y="556" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Assumptions: Deduction bars are the point gap between each reported headline and effective discount. Scarbrough Global reports 25-35% from full contract engineering versus about 3% (range 1-5%) from audit alone, over 3-6 negotiation rounds across 6-10 weeks per LJM.</title><tspan x="36" dy="0">Assumptions: Deduction bars are the point gap between each reported headline and effective discount. Scarbrough Global reports 25-35%</tspan><tspan x="36" dy="13.75">from full contract engineering versus about 3% (range 1-5%) from audit alone, over 3-6 negotiation rounds across 6-10 weeks per LJM.</tspan></text><text x="36" y="592" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>Totals reset the cumulative balance; missing values do not change it.</title><tspan x="36" dy="0">Totals reset the cumulative balance; missing values do not change it.</tspan></text></svg>