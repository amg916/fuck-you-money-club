<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img"><title>How Minimum Net Charges Erode Headline Discounts</title><desc>diagram id: diag-03-minimum-charge-discount-erosion; chapter number: 3; title: How Minimum Net Charges Erode Headline Discounts; subtitle: Two worked carrier-contract examples, in discount percentage points; chart type: waterfall; bars: label: Shipware Headline Discount; value: 50; display: 50% off; kind: total; label: $8.23 Minimum Net Charge Pin; value: -12; display: -12 pts; kind: deduction; label: Shipware Effective Discount; value: 38; display: 38% effective; kind: result; label: LJM Grid Plus Tier Headline; value: 35; display: 35% (23% grid + 12% tier); kind: total; label: LJM Minimum Floor Constraint; value: -13; display: -13 pts; kind: deduction; label: LJM Constrained Discount; value: 22; display: ~22% effective; kind: result; caption: Keith Myers works a Zone 4, 10 lb package at $13.27: 50% off nets $6.64, but the $8.23 minimum makes the effective discount 38%, and a 65% offer would save nothing. LJM shows a stacked 23% grid plus 12% tier constrained to about 22%, and tells shippers to maximize the grid portion.; assumptions note: Deduction bars are the point gap between each reported headline and effective discount. Scarbrough Global reports 25-35% from full contract engineering versus about 3% (range 1-5%) from audit alone, over 3-6 negotiation rounds across 6-10 weeks per LJM.; note: Attributed to Shipware (rjelY0C_iQg), LJM (56winzXYmPA), Scarbrough Global (jEjymzbOEFQ), and Refund Retriever (JAnVvaSg0TA), which calls the minimum net charge a basement floor under discounts.</desc><rect x="0" y="0" width="1000" height="620" fill="#FAF7F0" stroke="none" stroke-width="1"></rect><text x="36" y="49" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="28" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>How Minimum Net Charges Erode Headline Discounts</title><tspan x="36" dy="0">How Minimum Net Charges Erode Headline Discounts</tspan></text><line x1="36" y1="102" x2="964" y2="102" stroke="#8C6D32" stroke-width="1"/><text x="36" y="139" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>OPERATING FRAMEWORK</title><tspan x="36" dy="0">OPERATING FRAMEWORK</tspan></text><line x1="154" y1="162" x2="154" y2="512" stroke="#D8CEBE" stroke-width="1"/><text x="36" y="184" font-family="Courier, monospace" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>PLATE</title><tspan x="36" dy="0">PLATE</tspan></text><text x="36" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="start" style="font-variant-numeric:tabular-nums"><title>waterfall</title><tspan x="36" dy="0">waterfall</tspan></text><line x1="180" y1="480.0" x2="956" y2="480.0" stroke="#6B7280" stroke-width="1"/><rect x="188.0" y="365.8333333333333" width="111.33333333333334" height="114.16666666666669" fill="#F2ECE0" stroke="#8C6D32" stroke-width="1"><title>label: Shipware Headline Discount; value: 50; display: 50% off; kind: total</title></rect><text x="243.66666666666669" y="356.8333333333333" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>50</title><tspan x="243.66666666666669" dy="0">50</tspan></text><text x="243.66666666666669" y="499" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>Shipware Headline Discount</title><tspan x="243.66666666666669" dy="0">Shipware Headline</tspan><tspan x="243.66666666666669" dy="13.75">Discount</tspan></text><line x1="299.33333333333337" y1="365.8333333333333" x2="317.33333333333337" y2="365.8333333333333" stroke="#D8CEBE" stroke-width="1"/><rect x="317.33333333333337" y="365.8333333333333" width="111.33333333333334" height="27.400000000000034" fill="#F2ECE0" stroke="#8C6D32" stroke-width="1"><title>label: $8.23 Minimum Net Charge Pin; value: -12; display: -12 pts; kind: deduction</title></rect><text x="373.00000000000006" y="356.8333333333333" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>-12</title><tspan x="373.00000000000006" dy="0">-12</tspan></text><text x="373.00000000000006" y="499" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>$8.23 Minimum Net Charge Pin</title><tspan x="373.00000000000006" dy="0">$8.23 Minimum Net</tspan><tspan x="373.00000000000006" dy="13.75">Charge Pin</tspan></text><line x1="428.6666666666667" y1="393.23333333333335" x2="446.6666666666667" y2="393.23333333333335" stroke="#D8CEBE" stroke-width="1"/><rect x="446.6666666666667" y="306.4666666666667" width="111.33333333333334" height="86.76666666666665" fill="#F2ECE0" stroke="#8C6D32" stroke-width="1"><title>label: Shipware Effective Discount; value: 38; display: 38% effective; kind: result</title></rect><text x="502.33333333333337" y="297.4666666666667" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>38</title><tspan x="502.33333333333337" dy="0">38</tspan></text><text x="502.33333333333337" y="499" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#14171F" text-anchor="middle" style="font-variant-numeric:tabular-nums"><title>Shipware Effective Discount</title><tspan x="502.33333333333337" dy="0">Shipware Effective</tspan><tspan x="502.33333333333337" dy="13.75">Discount</tspan></text><line x1="558.0" y1="306.4666666666667" x2="576.0" y2="306.4666666666667" stroke="#D8CEBE" stroke-width="1"/><rect x="576.0" y="226.54999999999998" width="111.33333333333334" height="79.916666666